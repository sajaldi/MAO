{% extends 'base.html' %}

{% block title %}Eliminar Persona{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Eliminar Persona</h1>
    <a href="{% url 'person_list' %}" class="btn btn-secondary">Volver</a>
</div>

<div class="card">
    <div class="card-body">
        <p>¿Estás seguro de que quieres eliminar a <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'person_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
